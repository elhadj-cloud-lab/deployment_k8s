image:
  repository: ghcr.io/elhadj-cloud-lab/authentification_service
  tag: prod-4f77081

replicaCount: 2

javaOpts: ""

env:
  - name: SPRING_DATASOURCE_URL_USER
    value: jdbc:postgresql://postgres-auth:5432/auth_db
  - name: SPRING_DATASOURCE_USERNAME
    value: auth_user
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-auth-credentials
        key: password
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: authentification-service-secrets
        key: jwt-secret

initContainers:
  - name: wait-for-db
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        set -e
        host="postgres-auth"
        port="5432"
        echo "Waiting for ${host}:${port}..."
        i=0
        while [ "$i" -lt 120 ]; do
          if nc -z -w 2 "$host" "$port" 2>/dev/null; then
            echo "Database is reachable."
            exit 0
          fi
          i=$((i + 1))
          sleep 2
        done
        echo "Database not reachable after 240s."
        exit 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

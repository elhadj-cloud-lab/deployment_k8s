image:
  repository: ghcr.io/elhadj-cloud-lab/produit_back
  tag: dev-7290d14

replicaCount: 1

env:
  - name: SPRING_DATASOURCE_URL
    value: jdbc:postgresql://postgres-produit:5432/produit_db
  - name: SPRING_DATASOURCE_USERNAME
    value: produit_user
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-produit-credentials
        key: password
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: update
  - name: SPRING_JPA_SHOW_SQL
    value: "true"

initContainers:
  - name: wait-for-db
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        set -e
        host="postgres-produit"
        port="5432"
        echo "Waiting for ${host}:${port}..."
        i=0
        while [ "$i" -lt 120 ]; do
          if nc -z -w 2 "$host" "$port" 2>/dev/null; then
            echo "Database is reachable."
            exit 0
          fi
          i=$((i + 1))
          sleep 2
        done
        echo "Database not reachable after 240s."
        exit 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

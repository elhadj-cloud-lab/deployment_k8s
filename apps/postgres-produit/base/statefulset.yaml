apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-produit
  labels:
    app.kubernetes.io/name: postgres-produit
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-produit
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-produit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-produit
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: produit_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-produit-credentials
                  key: password
            - name: POSTGRES_DB
              value: produit_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U produit_user -d produit_db
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U produit_user -d produit_db
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres-produit
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-postgres-produit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.*
    helm:
      releaseName: postgres-produit
      values: |
        auth:
          username: produit_user
          database: produit_db
          existingSecret: postgres-produit-credentials
        image:
          tag: 16.4.0-debian-12-r0
        volumePermissions:
          enabled: true
        primary:
          persistence:
            enabled: true
            size: 5Gi
          containerSecurityContext:
            readOnlyRootFilesystem: false
          extraVolumes:
            - name: postgresql-run
              emptyDir: {}
          extraVolumeMounts:
            - name: postgresql-run
              mountPath: /var/run/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

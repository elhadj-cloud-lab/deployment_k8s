{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "produits-front.fullname" . }}-nginx
  labels:
{{ include "produits-front.labels" . | indent 4 }}
data:
  default.conf: |
    server {
        listen {{ .Values.containerPort }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
{{- end }}

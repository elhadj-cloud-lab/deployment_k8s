replicaCount: 1

image:
  repository: ghcr.io/elhadj-cloud-lab/produits_front
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

containerPort: 80

# Nginx sert le build Angular (sortie dans dist/<projet>/browser/).
nginx:
  enabled: true
  image: nginx:1.27-alpine
  imagePullPolicy: IfNotPresent
  # Chemin des assets dans l'image applicative (initContainer)
  sourcePath: /dist/Produits_front/browser

resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  pathType: Prefix
  tls: []
  backend:
    serviceName: produit-back
    servicePort: 80
